server {
 listen 80;
 server_name pointjoy.jinjiazh.com;
 return 301 https://pointjoy.jinjiazh.com$request_uri;
}
server {
 listen 443 ssl;
 server_name pointjoy.jinjiazh.com;
 ssl_certificate /etc/nginx/ssl/pointjoy.jinjiazh.com_bundle.crt;
 ssl_certificate_key /etc/nginx/ssl/pointjoy.jinjiazh.com.key;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 11m;
 root /opt/pointjoy/site;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 location / { try_files $uri $uri/ =404; }
 location /api/v1/ {
  proxy_pass http://127.0.0.1:4100;
  proxy_set_header Host pointjoy.jinjiazh.com;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 35s;
  proxy_request_buffering on;
  # No URI/token logging for private media and authentication.
  access_log off;
 }
}
