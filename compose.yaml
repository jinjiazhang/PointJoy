name: pointjoy-preview
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pointjoy
      POSTGRES_PASSWORD: pointjoy_local_only
      POSTGRES_DB: pointjoy
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pointjoy_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pointjoy"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  pointjoy_data:
