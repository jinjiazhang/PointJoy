 if(st.mode==='parent'){st.page=page;render();return;}
 pendingParentPage=page;
 if(st.source==='DIRECT'){modal('切换演示微信账号',`<p>这是孩子自己的微信账号，没有验证家长密码后升级权限的入口。</p><div class="notice">继续会模拟切到另一个已登录、已完成资料的家长账号；正式产品必须切换微信账号并重新鉴权。</div>`,`<button class="primary full" onclick="finishParent()">模拟切到家长微信账号</button>`);return;}
 modal('请家长输入密码',`<p>返回家长模式后，可以审核完成和安排奖励。</p><div class="field"><label for="pin">6 位家长 PIN</label><input id="pin" class="pin-input" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••" onkeydown="if(event.key==='Enter')checkPin()"></div><div id="pin-error" class="field-error"></div><p class="small">此预览的演示 PIN：<strong>246810</strong>。生产 PIN 必须由家长设置，恢复须验证已保存的恢复码。</p>`,`<button class="primary full" onclick="checkPin()">验证并返回家长</button>`);setTimeout(()=>$('pin').focus(),40);
}
function checkPin(){if($('pin').value!=='246810'){$('pin-error').textContent='密码不正确，请再试一次。演示 PIN 为 246810。';return;}finishParent();}
function finishParent(){closeModal();st.mode='parent';st.page=pendingParentPage;render();}
function nav(page){if(!st.profile){toast('先上传头像并填写昵称，完成资料后才能访问业务。');return;}if(childPages.has(page)){if(st.mode==='parent')enterChild(page);else{st.page=page;render();}}else requestParent(page);}
function header(title='',back=''){if(back)return `<div class="app-top"><button class="back" onclick="nav('${back}')">${ico('arrow')}${esc(title)}</button><span class="badge">${st.mode==='child'?'孩子视角':'家长视角'}</span></div>`;return `<div class="app-top"><div class="row"><img class="avatar" src="${st.avatar||demoSvg()}" alt="演示头像"><div><div class="top-title">${st.mode==='child'?'朵朵的积乐圈':'向日葵之家'}</div><div class="top-sub">${st.mode==='child'?(st.source==='DIRECT'?'我的微信账号':'家长共用设备'):'家长模式 · 妈妈'}</div></div></div>${st.mode==='child'?(st.source==='DELEGATED'?`<button class="top-action" onclick="requestParent()">${ico('lock')}<span>家长入口</span></button>`:`<button class="top-action" onclick="directAccount()">账号设置</button>`):`<button class="top-action" onclick="enterChild()">孩子模式 ↗</button>`}</div>`;}
function bottom(){const tabs=st.mode==='parent'?[['home','home','首页'],['plans','list','计划'],['rewards','gift','奖励'],['family','family','家庭']]:[['today','home','今天'],['wishes','gift','心愿'],['growth','sprout','成长']];return `<nav class="bottom" aria-label="主导航">${tabs.map(([p,i,t])=>`<button class="${st.page===p?'active':''}" ${st.page===p?'aria-current="page"':''} onclick="nav('${p}')">${ico(i)}${t}</button>`).join('')}</nav>`;}
function shell(html,title='',back=''){return header(title,back)+`<div class="content">${html}</div>`+(!back?bottom():'');}
function taskLabel(){return({OPEN:'等你完成',SUBMITTED:'等待家长确认',NEEDS_CHANGES:'再补充一下',APPROVED:'已完成 · +10 积分'})[st.task];}
function reward(){return rewardData.find(x=>x.id===st.reward)||rewardData[0];}
function photoGrid(items,editing=false){return `<div class="proofs">${items.map((p,i)=>`<div class="proof ${p.status==='FAILED'?'failed':''}">${p.src?`<button style="display:block;padding:0;min-height:0;width:100%" onclick="viewPhoto('${editing?'draft':'submitted'}',${i})" aria-label="查看第 ${i+1} 张照片"><img src="${p.src}" alt="完成照片${p.demo?'，演示插画':''}"></button>`:`<div style="height:65px;display:grid;place-items:center">${ico('camera')}</div>`}<span>${p.status==='READY'?(p.demo?'可用 · 示意照片':'可用 · 仅本地预览'):p.status==='FAILED'?esc(p.error):p.status==='UPLOADING'?'上传中（模拟）…':'处理中（模拟）…'}</span>${editing?`<button class="remove" aria-label="移除第 ${i+1} 张照片" onclick="removePhoto('${p.id}')">×</button>${p.status==='FAILED'?`<button class="retry" onclick="retryPhoto('${p.id}')">重新选择</button>`:''}`:''}</div>`).join('')}</div>`;}
function loginPage(){return `<div class="content" style="padding-top:45px"><div class="brand-mark" style="width:58px;height:58px;border-radius:20px;margin-bottom:27px">${ico('sprout')}</div><span class="tag">欢迎来到积乐圈</span><h1 style="margin-top:12px">让努力被看见，<br>让约定有回应。</h1><p class="muted" style="font-size:14px;margin-top:20px">所有使用者先微信登录，首次上传头像、填写昵称后才能进入家庭。</p><div class="field"><label for="login-as">这次模拟谁的微信登录？</label><select id="login-as" onchange="st.loginAs=this.value"><option value="parent" ${st.loginAs==='parent'?'selected':''}>家长微信账号（也可代孩子操作）</option><option value="child" ${st.loginAs==='child'?'selected':''}>孩子微信账号（已绑定朵朵）</option></select></div><label class="consent"><input id="consent" type="checkbox"><span>我已阅读并同意 <button class="link" style="min-height:20px" onclick="privacyDemo()">隐私说明</button></span></label><button class="primary full" onclick="login()">模拟微信登录</button><div class="notice section">仅本地设计演示，不连接微信。这一身份选项用于加载预置数据，正式产品的家庭权限必须由服务端绑定关系决定。</div></div>`;}
function profilePage(){return `<div class="content" style="padding-top:32px"><span class="badge">S01 · 首次登录资料</span><h1 style="margin-top:18px">先让大家认出你</h1><p class="muted" style="font-size:14px;margin-top:12px">上传你喜欢的头像，填写一个昵称。<br>头像可以是插画，不必是真人照片。</p><div class="avatar-upload">${st.avatar?`<img src="${st.avatar}" alt="已选择的头像">`:`<div class="avatar-placeholder">${ico('camera')}</div>`}<button class="link" onclick="$ ('avatar-file').click()">${st.avatar?'重新选择头像':'上传头像（必填）'}</button><small class="muted">JPEG / PNG / WebP，原文件不超过 10 MiB</small></div><div class="field"><label for="nickname">昵称（必填）</label><input id="nickname" maxlength="24" value="${esc(st.nickname)}" placeholder="如：妈妈、朵朵" oninput="st.nickname=this.value"></div><div id="profile-error" class="field-error"></div><button class="primary full section" onclick="saveProfile()">保存并继续</button><button class="secondary full" style="margin-top:10px" onclick="demoProfile()">填入演示资料（模拟上传）</button><div class="notice section">真实选择的文件也只在本页本地预览，不发送网络；演示资料用程序绘制的插画模拟已上传状态。正式产品必须等待服务端校验成功并保存资料，不能靠占位图放行。</div></div>`;}
function login(){if(!$('consent').checked){toast('请先阅读并同意隐私说明。');return;}st.page='profile';render();}
function demoProfile(){st.avatar=demoSvg();st.nickname=st.loginAs==='parent'?'妈妈':'朵朵';render();toast('已填入虚构昵称与示意头像，模拟上传成功。请点击保存并继续。');}
function saveProfile(){const n=st.nickname.trim();if(!st.avatar||!n){$('profile-error').textContent='头像上传和昵称都必须完成，才能进入业务。';return;}if([...n].length>24){$('profile-error').textContent='昵称最多 24 字。';return;}st.nickname=n;st.profile=true;st.mode=st.loginAs==='child'?'child':'parent';st.source=st.loginAs==='child'?'DIRECT':'DELEGATED';st.page=st.mode==='child'?'today':'home';render();toast('演示资料保存成功。当前数据全部为本地虚构数据。');}
function privacyDemo(){modal('预览的隐私说明',`<p>此文件无网络请求和持久化存储。选择的图片仅通过浏览器本地文件能力读取；刷新或恢复演示会清除本次内存数据。</p><p>正式产品应在真实微信授权前提供可阅读的隐私政策，照片仅本人及有权限的家长可见。</p>`,``);}
function homePage(){const pend=st.task==='SUBMITTED'?1:0,o=st.order;return shell(`<div class="row between" style="margin-bottom:17px"><div><span class="tag">SATURDAY / 09.19</span><h1 style="margin-top:8px">今天也慢慢来。</h1></div>${art('sprout')}</div><p class="muted small" style="margin-bottom:20px">把约定说清楚，把每一次努力记下来。</p><div class="grid3"><button class="stat" onclick="st.tab='activity';nav('review')"><span>完成待审核</span><strong>${pend}</strong><span>确认孩子的努力 →</span></button><button class="stat" onclick="st.tab='order';nav('review')"><span>兑换待批准</span><strong>${o?.status==='PENDING_APPROVAL'?1:0}</strong><span>一起商量奖励 →</span></button><button class="stat" onclick="nav('order')"><span>奖励待兑现</span><strong>${o?.status==='READY'?1:0}</strong><span>记得兑现约定 →</span></button></div><section class="section"><div class="section-head"><h2>孩子的今天</h2><span class="badge">1 位孩子</span></div><div class="card"><div class="row"><img src="${demoSvg()}" class="avatar" alt="朵朵演示头像"><div class="grow"><h3>朵朵</h3><p class="small muted">日常已通过 ${st.task==='APPROVED'?1:0} / 1 · 挑战另计</p></div><strong class="points">${st.available}<small> 分</small></strong></div><div class="meter"><i style="width:${st.task==='APPROVED'?100:0}%"></i></div><div class="row between"><span class="small muted">${taskLabel()}</span><button class="link" onclick="st.tab='activity';nav('review')">看完成记录 →</button></div></div></section><div class="hero section"><span class="tag">一个小约定</span><h2 style="margin-top:8px">努力有人看见，<br>奖励也有人记得。</h2><p>先批准，再实际兑现。<br>让孩子知道每份承诺都会被认真对待。</p></div><button class="secondary full section" onclick="enterChild()">进入朵朵的孩子模式</button>`);}
function todayPage(){return shell(`<div class="hero"><span class="tag">9 月 19 日 · 星期六</span><h1 style="margin-top:10px">朵朵，今天想<br>完成哪件小事？</h1><div class="balance"><div><strong>${st.available}</strong><small>可用积分</small></div><div class="tiny-stat"><span class="small muted">申请预留</span><strong>${st.held}<small> 分</small></strong></div></div><div class="hero-big">${ico('sprout')}</div></div><section class="section"><div class="section-head"><h2>今天的约定</h2><span class="small muted">${st.task==='APPROVED'?1:0} / 1 已完成</span></div><div class="card task"><div class="row">${art('rope')}<div class="grow"><span class="badge">日常</span><h3 style="margin-top:6px">跳绳 100 次</h3><p>完成后告诉家长，一起确认。</p></div><span class="points">+10</span></div><div class="footer"><span class="small muted">${taskLabel()}</span><button class="${st.task==='OPEN'||st.task==='NEEDS_CHANGES'?'primary':'secondary'}" onclick="nav('activity')">${st.task==='OPEN'?'我完成了':st.task==='NEEDS_CHANGES'?'去补充':'查看记录'}</button></div></div><div class="notice" style="margin-top:12px">目标由家长和你一起约定。先好好完成，再慢慢积攒。</div></section><section class="section"><div class="section-head"><h2>心愿在前面</h2><button class="link" onclick="nav('wishes')">去看看 →</button></div><div class="card row">${art('game','sun')}<div class="grow"><h3>游戏 20 分钟</h3><p class="small muted">${st.available>=30?'已经攒够，可以申请啦':`还差 ${30-st.available} 积分`}</p></div><span class="points">30 分</span></div></section>`);}
function activityPage(){const edit=['OPEN','NEEDS_CHANGES'].includes(st.task);return shell(`<span class="badge">日常 · 今天 24:00 前</span><div class="row" style="margin-top:19px">${art('rope')}<div><h1>跳绳 100 次</h1><p class="muted small" style="margin-top:6px">达到目标，通过后得 10 积分</p></div></div><div class="notice section">和家长约好的跳绳活动。填写本次总次数；多次输入不会自动相加。</div>${st.task==='NEEDS_CHANGES'?`<div class="notice warn section"><strong>再补充一下</strong><br>${esc(st.reason)}<br>演示补充截止：9 月 20 日 18:00</div>`:''}${edit?`<div class="field"><label for="count">这次一共完成了多少？</label><div class="numinput"><input id="count" inputmode="numeric" type="number" min="0" max="100000" step="1" value="${esc(st.count)}" placeholder="0" oninput="st.count=this.value;st.draftSaved=false"><span>次</span></div><small>目标 100 次，超过目标仍为 10 积分。</small></div><div class="field"><label for="note">想说的话 <span class="muted">（选填）</span></label><textarea id="note" maxlength="200" placeholder="例如：今天和爸爸一起跳的。" oninput="st.note=this.value;st.draftSaved=false">${esc(st.note)}</textarea></div><div class="section-head section"><h3>完成照片 <span class="small muted">选填 · ${st.proofs.length}/3</span></h3></div>${photoGrid(st.proofs,true)}<div class="upload-area"><div class="row"><button class="link" onclick="choosePhotos()">${ico('camera')} 选择本地照片</button><button class="link" onclick="addDemoPhoto()">添加示意照片</button></div><p>每张 ≤ 10 MiB，JPEG / PNG / WebP<br>仅本人及有权限的家长可见。<br>草稿照片保留 24 小时，首次正式提交后保留 180 天。</p></div><div class="field-error" id="activity-error"></div><button class="primary full section" onclick="submitTask()">提交给家长</button><button class="secondary full" style="margin-top:9px" onclick="saveDraft()">保存草稿</button><p class="small muted" style="text-align:center;margin-top:10px">${st.draftSaved?'草稿已模拟同步；正式产品应保存到服务端。':'未发送内容只在本地，刷新将丢失。'}</p>`:`<div class="card section"><span class="badge ${st.task==='SUBMITTED'?'wait':''}">${taskLabel()}</span><div class="summary" style="margin-top:20px"><div><span>本次总完成量</span><strong>${esc(st.count)} 次</strong></div><div><span>说明</span><strong>${esc(st.note)||'未填写'}</strong></div></div>${photoGrid(st.submittedProofs)}<p class="small muted" style="margin-top:17px">${st.task==='SUBMITTED'?'已经告诉家长啦，确认后积分会到账。':'家长已确认，这次获得了 10 积分。'}</p></div><button class="primary full section" onclick="nav('today')">回到今天</button>`}`,'完成记录','today');}
function reviewPage(){const task=st.task==='SUBMITTED';return shell(`<h1>把努力接住</h1><p class="muted small" style="margin:10px 0 21px">按事实确认，给孩子一个清楚的回应。</p><div class="tabs"><button class="${st.tab==='activity'?'active':''}" onclick="st.tab='activity';render()">完成审核 ${task?1:0}</button><button class="${st.tab==='order'?'active':''}" onclick="st.tab='order';render()">兑换批准 ${st.order?.status==='PENDING_APPROVAL'?1:0}</button></div>${st.tab==='order'?(st.order?orderMini():`<div class="empty">${art('gift','sun')}<h3>还没有待批准的申请</h3><p>孩子申请后，会出现在这里。</p></div>`):`<div class="card"><div class="row"><img src="${demoSvg()}" class="avatar" alt="朵朵头像"><div class="grow"><h3>朵朵 · 跳绳</h3><p class="small muted">9 月 19 日 · 日常</p></div><span class="badge ${task?'wait':''}">${taskLabel()}</span></div><div class="divider"></div><div class="summary"><div><span>约定目标</span><strong>100 次</strong></div><div><span>孩子填写</span><strong>${esc(st.count)||'尚未填写'} ${st.count?'次':''}</strong></div><div><span>通过后获得</span><strong>10 积分</strong></div></div>${st.note?`<p style="font-size:14px;margin-top:16px">${esc(st.note)}</p>`:''}${photoGrid(st.submittedProofs)}${task?`<div class="notice section">照片仅辅助确认，不自动判断达标。同一位家长代录的提交也可以由本人审核。</div><button class="primary full section" onclick="approveTask()">通过并加 10 积分</button><button class="secondary full" style="margin-top:9px" onclick="returnTask()">请孩子补充</button>`:`<p class="small muted section">${st.task==='APPROVED'?'已确认入账，不会重复加分。':'目前没有等待审核的提交，可先在孩子视角提交。'}</p><button class="secondary full section" onclick="enterChild('activity')">去孩子的完成页面</button>`}</div>`}`,'待办','home');}
function wishesPage(){const w=rewardData.find(x=>x.id===st.wish)||rewardData[0];return shell(`<h1>一个小心愿</h1><p class="muted small" style="margin:10px 0 20px">慢慢攒，换一份自己喜欢的奖励。</p><div class="hero"><div class="row">${art(w.icon,w.tone)}<div class="grow"><span class="tag">我的当前心愿</span><h2 style="margin-top:6px">${w.name}</h2></div></div><div class="meter" style="margin-top:21px" role="progressbar" aria-label="心愿积攒进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.min(100,Math.floor(st.available/w.cost*100))}"><i style="width:${Math.min(100,st.available/w.cost*100)}%"></i></div><div class="row between"><strong class="points">${st.available} / ${w.cost} 积分</strong><span class="small">${st.available>=w.cost?'已经攒够啦':`还差 ${w.cost-st.available} 积分`}</span></div><p class="small">设为心愿不会预留积分或库存。</p></div><section class="section"><div class="section-head"><h2>我的兑换</h2><span class="small muted">${st.order?1:0} 份</span></div>${st.order?orderMini(true):`<div class="card small muted">申请奖励后，在这里看家长的回复。</div>`}</section><section class="section"><div class="section-head"><h2>奖励小屋</h2><span class="small muted">一份一份，认真兑现</span></div><div class="reward-grid">${rewardData.map(r=>`<button class="reward" onclick="st.reward='${r.id}';nav('reward')">${art(r.icon,r.tone)}<h3>${r.name}</h3><p class="points">${r.cost} 积分 <span class="muted" style="font-weight:400">· ${r.type}</span></p></button>`).join('')}</div></section>`);}
function rewardPage(){const r=reward(),pending=st.order&&['PENDING_APPROVAL','READY'].includes(st.order.status);return shell(`<div style="background:#fff0bc;border-radius:24px;height:165px;display:grid;place-items:center;color:#855f16">${ico(r.icon).replace('class="icon"','class="icon" style="width:94px;height:94px"')}</div><span class="badge" style="margin-top:20px">${r.type} · 一份</span><h1 style="margin-top:12px">${r.name}</h1><strong class="points" style="font-size:25px;display:block;margin-top:11px">${r.cost} <span style="font-size:14px">积分</span></strong><p class="muted" style="font-size:14px;margin-top:18px">${r.detail}</p><div class="card section summary"><div><span>可用积分</span><strong>${st.available} 积分</strong></div><div><span>申请预留</span><strong>${st.held} 积分</strong></div><div><span>库存</span><strong>不限量</strong></div><div><span>本人每自然周</span><strong>最多 2 次</strong></div></div><div class="notice section">申请后先预留积分，家长批准时才花掉。72 小时内未批准，会释放预留。</div><button class="primary full section" ${st.available<r.cost||pending?'disabled':''} onclick="requestReward()">申请这份奖励</button>${st.available<r.cost?`<p class="field-error">还差 ${r.cost-st.available} 积分，可以先设为心愿。</p>`:pending?`<p class="small muted" style="margin-top:8px">先处理当前未兑现的演示订单，再试其他奖励。</p>`:''}<button class="secondary full" style="margin-top:10px" onclick="st.wish='${r.id}';toast('已设为当前心愿，不预留积分和库存。');render()">${st.wish===r.id?'已是当前心愿':'设为当前心愿'}</button>`,'奖励详情','wishes');}
function orderName(){return({PENDING_APPROVAL:'等待家长同意',READY:'已批准 · 等待兑现',FULFILLED:'已兑现',CANCELED:'已取消',REJECTED:'未批准'})[st.order?.status]||'暂无订单';}
function orderMini(child=false){const o=st.order;return `<div class="card"><div class="row">${art(o.icon,o.tone)}<div class="grow"><h3>${o.name}</h3><p class="small muted" style="margin-top:6px">${orderName()} · ${o.cost} 积分</p></div></div>${child?`<p class="small muted" style="margin-top:13px">${o.status==='PENDING_APPROVAL'?`已预留 ${o.cost} 积分，等家长同意。`:o.status==='READY'?'家长同意啦，一起安排什么时候兑现吧。':o.status==='FULFILLED'?'约定的奖励已经提供完毕。':`原因：${esc(o.reason)}。积分已返还。`}</p>${['PENDING_APPROVAL','READY'].includes(o.status)?`<button class="link" style="margin-top:9px" onclick="cancelOrder(true)">取消这次兑换</button>`:''}`:`<button class="link" style="margin-top:10px" onclick="nav('order')">查看并处理 →</button>`}</div>`;}
function orderPage(){const o=st.order;if(!o)return shell(`<div class="empty">${art('gift','sun')}<h2>还没有兑换申请</h2><p>先让孩子积攒到 30 积分，再申请游戏 20 分钟。</p><button class="primary full" onclick="enterChild('wishes')">去孩子的心愿页</button></div>`,'兑换详情','rewards');return shell(`<span class="badge ${o.status==='PENDING_APPROVAL'?'wait':''}">${orderName()}</span><h1 style="margin-top:15px">${o.name}</h1><p class="small muted" style="margin-top:10px">朵朵 · 一份奖励 · 订单演示 001</p><div class="card section summary"><div><span>原约定价格</span><strong>${o.cost} 积分</strong></div><div><span>权益内容</span><strong>一次完整提供</strong></div><div><span>当前可用 / 预留</span><strong>${st.available} / ${st.held}</strong></div></div><p class="muted" style="font-size:14px;margin-top:17px">${o.detail}</p><ol class="time-line"><li><strong>孩子申请</strong><p>已按申请时的价格预留 ${o.cost} 积分。</p></li>${['READY','FULFILLED'].includes(o.status)?`<li><strong>妈妈已批准</strong><p>预留积分正式支出，约定等待兑现。</p></li>`:''}${o.status==='FULFILLED'?`<li><strong>实际兑现完成</strong><p>${esc(o.fulfillNote)||'家长已完整提供约定奖励。'}</p></li>`:''}${['CANCELED','REJECTED'].includes(o.status)?`<li><strong>${orderName()}</strong><p>${esc(o.reason)} · 已按原规则返还积分。</p></li>`:''}</ol>${o.status==='PENDING_APPROVAL'?`<div class="notice">批准截止：演示申请后 72 小时。批准后会花费 ${o.cost} 积分，并承诺安排这份奖励。</div><button class="primary full section" onclick="approveOrder()">批准并花费 ${o.cost} 积分</button><div class="row" style="margin-top:9px"><button class="secondary grow" onclick="rejectOrder()">暂不同意</button><button class="secondary grow" onclick="cancelOrder(false)">取消申请</button></div>`:o.status==='READY'?`<div class="notice">批准不是兑现。实际给到孩子约定的奖励后，再确认已兑现。待兑现订单不会自动过期。</div><button class="primary full section" onclick="fulfillOrder()">已经实际兑现</button><button class="secondary full" style="margin-top:9px" onclick="cancelOrder(false)">取消并退回 ${o.cost} 积分</button>`:`<div class="notice">${o.status==='FULFILLED'?'奖励已实际提供，此订单不能取消或退款。':'本订单已结束，不会重复返还积分。'}</div>`}`,'兑换详情','rewards');}
function growthPage(){return shell(`<span class="tag">每一点努力，都算数</span><h1 style="margin-top:10px">朵朵的小小成长</h1><div class="hero section"><div class="balance" style="margin-top:0"><div><strong>${st.available}</strong><small>可用积分</small></div><div class="tiny-stat"><span class="small">申请预留</span><strong>${st.held} 分</strong></div></div><p class="small">预留还没有花掉，只是在等家长同意。</p></div><div class="section-head section"><h2>积分明细</h2><span class="small muted">仅朵朵本人</span></div><div class="card">${st.logs.slice().reverse().map((l,i)=>`<div class="row ${i?'section':''}"><div class="grow"><h3 style="font-size:14px">${esc(l.label)}</h3><p class="small muted" style="margin-top:4px">${esc(l.detail)}</p><span class="badge" style="margin-top:6px">${l.type}</span></div><strong class="points">${l.delta}</strong></div>`).join('')}</div>${st.source==='DIRECT'?`<button class="secondary full section" onclick="directAccount()">我的账号资料与隐私</button>`:''}`);}
function plansPage(){return shell(`<div class="section-head"><div><span class="tag">清楚的家庭约定</span><h1 style="margin-top:9px">我们的计划</h1></div><button class="primary" style="font-size:12px;padding:10px 14px" onclick="nav('editor')">＋ 新建</button></div><div class="tabs"><button class="active" onclick="toast('本预览仅配置日常；挑战完整规则见交互文档P04/P05。')">日常</button><button onclick="challengeInfo()">一次挑战说明</button></div><div class="card task"><div class="row">${art('rope')}<div><h3>跳绳 100 次</h3><p>每天 · 朵朵 · 通过得 10 积分</p><span class="badge">今天已安排</span></div></div><button class="link section" onclick="st.tab='activity';nav('review')">查看今天完成情况 →</button></div>${st.plans.map(p=>`<div class="card row">${art('list')}<div><h3>${esc(p.name)}</h3><p class="small muted">完成即可 · ${p.points} 积分 · ${p.start==='today'?'今天发布后':'明天'}起</p><span class="badge">演示已发布</span></div></div>`).join('')}<div class="notice section">日常修改、暂停和恢复都从次日生效，今日实例保持原约定。创建时可明确选择今天开始。</div>`);}
function editorPage(){return shell(`<h1>从一件小事开始</h1><p class="muted small" style="margin-top:11px">此页演示新建「完成即可」的日常计划。</p><div class="field"><label for="plan-name">计划名称</label><input id="plan-name" maxlength="40" placeholder="如：整理书包"></div><div class="field"><label for="plan-desc">完成要求（选填）</label><textarea id="plan-desc" maxlength="500" placeholder="一起说清楚怎样算完成。"></textarea></div><div class="field"><label for="plan-points">通过后获得积分</label><input id="plan-points" type="number" min="1" max="1000" step="1" value="5"></div><div class="field"><label for="plan-start">生效日期</label><select id="plan-start"><option value="tomorrow">明天开始（默认）</option><option value="today">今天从发布时刻开始</option></select></div><div class="card section summary"><div><span>适用孩子</span><strong>朵朵</strong></div><div><span>日常安排</span><strong>每天</strong></div><div><span>计量方式</span><strong>完成即可</strong></div></div><div id="plan-error" class="field-error"></div><button class="primary full section" onclick="savePlan()">确认发布这份约定</button>`,'新建计划','plans');}
function rewardsPage(){return shell(`<h1>把奖励约定好</h1><p class="muted small" style="margin:10px 0 22px">每一份都说清楚，批准之后记得兑现。</p><div class="tabs"><button class="${st.rewardTab==='catalog'?'active':''}" onclick="st.rewardTab='catalog';render()">奖励库</button><button class="${st.rewardTab==='orders'?'active':''}" onclick="st.rewardTab='orders';render()">兑换订单 ${st.order?1:0}</button></div>${st.rewardTab==='orders'?(st.order?orderMini():`<div class="empty">${art('gift','sun')}<h3>还没有兑换订单</h3><p>孩子或家长代孩子申请后，会出现在这里。</p></div>`):`<div class="stack">${rewardData.map(r=>`<div class="card row" style="margin:0">${art(r.icon,r.tone)}<div class="grow"><h3>${r.name}</h3><p class="small muted">${r.cost} 积分 · 不限量</p><span class="badge" style="margin-top:5px">上架中</span></div></div>`).join('')}</div><div class="notice section">一单一份，每个孩子每自然周最多 2 次。改价不会改变已有订单的原价。</div><button class="secondary full section" onclick="enterChild('wishes')">体验孩子申请奖励</button>`}`);}
function familyPage(){return shell(`<h1>向日葵之家</h1><p class="muted small" style="margin-top:10px">一起制定，也一起遵守。</p><div class="section-head section"><h2>孩子</h2><span class="small muted">1 个独立档案</span></div><div class="card"><div class="row"><img class="avatar" src="${demoSvg()}" alt="朵朵示意头像"><div class="grow"><h3>朵朵</h3><p class="small muted">已有自己的微信账号绑定 · 演示</p></div></div><button class="primary full section" onclick="enterChild()">在家长设备进入孩子模式</button></div><div class="section-head section"><h2>共同家长</h2></div><div class="card row">${art('family')}<div><h3>妈妈</h3><p class="small muted">家庭负责人 · 可独立完成代录、审核与兑现</p></div></div><div class="notice section"><strong>两种孩子使用方式</strong><br>孩子自己微信登录：仅能使用自己的账号。<br>家长共用设备：返回家长需要验证密码。</div><button class="secondary full section" onclick="bindingInfo()">了解孩子绑定与账号管理</button><button class="secondary full" style="margin-top:10px" onclick="privacyDemo()">隐私与本地演示说明</button><p class="small muted" style="margin-top:16px">头像上传、成员邀请、解绑、归档及隐私申请完整页面见 P12—P16。此页仅展示信息结构。</p>`);}
function directAccount(){modal('孩子自己的账号',`<p>孩子自己的微信账号只能管理本人头像昵称、隐私申请与退出登录，不能通过家长密码获得家长权限。</p><div class="notice">正式产品在 C06 子页提供个人资料修改和个人数据导出/删除申请。本预览不处理真实账号。</div>`,`<button class="primary full" onclick="closeModal();st.page='login';st.profile=false;st.avatar='';st.nickname='';st.loginAs='child';render()">退出本次演示登录</button>`);}
function bindingInfo(){modal('孩子微信账号绑定',`<p>负责人为已有孩子档案生成专属绑定邀请（24 小时、一次成功有效）。孩子微信登录并上传头像填写昵称后申请，负责人核对并批准。</p><p>解绑立即撤销该账号的孩子会话，账本和历史仍保留；家长可以继续代操作。换绑需先解绑，不能直接覆盖。</p>`,``);}
function challengeInfo(){modal('一次挑战的约定',`<p>一次挑战有明确起止时间，每个孩子全周期只有一次达标奖励。发布后目标、积分、适用孩子和窗口冻结。</p><p>停止后不接收尚未提交的新结果，已提交可审核，已退回记录保留补充期限。此预览不创建挑战，完整字段见 P04。</p>`,``);}
function guide(){const checks=[st.profile,['SUBMITTED','NEEDS_CHANGES','APPROVED'].includes(st.task),st.task==='APPROVED',!!st.order,st.order&&['READY','FULFILLED'].includes(st.order.status),st.order?.status==='FULFILLED'];$('guide').innerHTML=`<h2>跟着一份约定走一遍</h2><p>先完成资料，再体验「跳绳 → 游戏 20 分钟」。家长审核前后，留意可用与预留的变化。</p><ol class="steps">${[['微信登录 + 完整资料','头像上传、昵称缺一不可'],['孩子提交跳绳 100 次','可附 0—3 张完成照片'],['家长确认，获得 10 积分','起始 20 → 可用 30'],['孩子申请游戏 20 分钟','可用 0 / 申请预留 30'],['家长批准','预留变 0，正式消费 30'],['实际提供后确认兑现','不再次扣分、不自动计时']].map(([a,b],i)=>`<li class="${checks[i]?'done':''}"><b>${checks[i]?'✓':i+1}</b><div><strong>${a}</strong><small>${b}</small></div></li>`).join('')}</ol><div class="guide-card"><span class="tag">演示控制台</span><p>在共用设备退出孩子模式时，输入演示 PIN <strong>246810</strong>。孩子本人微信账号只能退出或切换账号。</p><button class="secondary" onclick="requestParent()">家长视角</button><button class="secondary" onclick="nav('today')">共用设备孩子视角</button><button class="link" onclick="confirmReset()">恢复初始演示</button><p>图片不会上传，状态和积分仅存在当前页内存。刷新页面会清除；此预览不验证真实安全/时间/并发能力。</p></div>`;}
function render(){const pages={login:loginPage,profile:profilePage,home:homePage,today:todayPage,activity:activityPage,review:reviewPage,wishes:wishesPage,reward:rewardPage,order:orderPage,growth:growthPage,plans:plansPage,editor:editorPage,rewards:rewardsPage,family:familyPage};$('app').innerHTML=pages[st.page]();$('routes').innerHTML=routeData.map(([p,id,name])=>`<button class="${st.page===p?'active':''}" onclick="nav('${p}')"><span>${name}</span><small>${id}</small></button>`).join('');guide();}
function saveDraft(){if(!validCount(false))return;st.draftSaved=true;toast('草稿已模拟保存，不发分，也没有提交给家长。');render();}
function validCount(requireGoal){const n=Number(st.count);if(st.count===''||!Number.isInteger(n)||n<0||n>100000){$('activity-error').textContent='请填写 0—100,000 之间的整数次数。';return false;}if(requireGoal&&n<100){$('activity-error').textContent='还未达到约定的 100 次，可以先保存草稿，完成后再提交。';return false;}return true;}
function submitTask(){if(!validCount(true))return;if(st.proofs.some(p=>p.status!=='READY')){$('activity-error').textContent='请等全部照片处理完成。失败照片可重试或移除后无图提交。';return;}st.task='SUBMITTED';st.submittedProofs=st.proofs.map(p=>({...p}));st.draftSaved=false;render();toast('已经告诉家长啦，确认后积分会到账。');}
function approveTask(){if(st.task!=='SUBMITTED')return;st.task='APPROVED';st.available+=10;st.logs.push({label:'跳绳 100 次 · 妈妈确认',detail:'固定奖励一次到账',delta:'+10',type:'赚取'});render();toast('已通过，10 积分到账。朵朵现在可用 30 积分。');}
function returnTask(){modal('请孩子补充',`<p>说清楚需要补充什么，不改变原来的达标要求。</p><div class="field"><label for="reason">补充原因（必填）</label><textarea id="reason" maxlength="200" placeholder="请补充这次完成的总次数。"></textarea></div><div id="reason-error" class="field-error"></div><div class="notice section">演示期限为 9 月 20 日 18:00。正式期限取原截止与本次退回后 24 小时中较晚者。</div>`,`<button class="primary full" onclick="confirmReturn()">确认请孩子补充</button>`);}
function confirmReturn(){const v=$('reason').value.trim();if(!v){$('reason-error').textContent='请填写补充原因。';return;}st.reason=v;st.task='NEEDS_CHANGES';closeModal();render();toast('已请孩子补充，暂不发放积分。');}
function requestReward(){const r=reward();if(st.available<r.cost)return;modal('确认这份小心愿',`<div class="row" style="margin-top:18px">${art(r.icon,r.tone)}<div><h3>${r.name}</h3><p>${r.cost} 积分 · 一份</p></div></div><div class="card section summary"><div><span>申请后可用</span><strong>${st.available-r.cost} 积分</strong></div><div><span>申请后预留</span><strong>${st.held+r.cost} 积分</strong></div></div><p>家长批准时才正式花掉，72 小时内未批准会释放。本次不会自动提供游戏时间。</p>`,`<button class="primary full" onclick="confirmRequest()">预留 ${r.cost} 积分并申请</button>`);}
function confirmRequest(){const r=reward();if(st.order&&['PENDING_APPROVAL','READY'].includes(st.order.status))return;st.available-=r.cost;st.held+=r.cost;st.order={...r,status:'PENDING_APPROVAL'};st.logs.push({label:`申请 ${r.name}`,detail:`转入申请预留 ${r.cost}，还没有花掉`,delta:`预留 ${r.cost}`,type:'预留'});closeModal();st.page='wishes';render();toast('申请已送给家长，积分先帮你留好了。');}
function approveOrder(){const o=st.order;if(o?.status!=='PENDING_APPROVAL')return;o.status='READY';st.held-=o.cost;st.logs.push({label:`批准 ${o.name}`,detail:'原预留正式支出，不再次扣可用积分',delta:`−${o.cost}`,type:'兑换支出'});render();toast('已批准。请安排兑现，实际提供后再确认。');}
function fulfillOrder(){modal('确认实际兑现',`<p>请确认已经完整提供「${esc(st.order.name)}」。批准只是承诺，实际提供完毕才属于兑现。</p><label class="consent"><input id="fulfilled-check" type="checkbox"><span>我已经给了孩子约定的这份奖励</span></label><div class="field"><label for="fulfill-note">兑现说明（选填）</label><textarea id="fulfill-note" maxlength="200" placeholder="例如：晚饭后已经一起安排好并使用完。"></textarea></div><div id="fulfill-error" class="field-error"></div>`,`<button class="primary full" onclick="confirmFulfill()">确认已兑现</button>`);}
function confirmFulfill(){if(!$('fulfilled-check').checked){$('fulfill-error').textContent='请确认奖励已经实际提供。';return;}if(st.order?.status!=='READY')return;st.order.status='FULFILLED';st.order.fulfillNote=$('fulfill-note').value.trim();closeModal();render();toast('这份奖励已兑现，积分没有再次扣除。');}
function cancelOrder(child){const o=st.order;if(!o||!['PENDING_APPROVAL','READY'].includes(o.status))return;modal('取消这次兑换',`<p>${o.status==='PENDING_APPROVAL'?'释放预留':'退回原价'} ${o.cost} 积分。本演示奖励不限量；有限库存和原申请周次数在正式系统同时恢复。</p><div class="field"><label for="cancel-reason">取消原因</label>${child?`<select id="cancel-reason"><option>暂时不想要了</option><option>想换别的</option><option>和家长商量后取消</option></select>`:`<textarea id="cancel-reason" maxlength="200" placeholder="请说明为什么取消（必填）。"></textarea>`}</div><div id="cancel-error" class="field-error"></div>`,`<button class="danger-btn full" onclick="confirmCancel('CANCELED')">确认取消并返还 ${o.cost} 积分</button>`);}
function rejectOrder(){modal('暂不同意这次兑换',`<p>请告诉孩子原因，预留积分会全部释放。</p><div class="field"><label for="cancel-reason">原因（必填）</label><textarea id="cancel-reason" maxlength="200" placeholder="把约定说清楚。"></textarea></div><div id="cancel-error" class="field-error"></div>`,`<button class="primary full" onclick="confirmCancel('REJECTED')">确认未批准并释放积分</button>`);}
function confirmCancel(next){const reason=$('cancel-reason').value.trim();if(!reason){$('cancel-error').textContent='请填写原因。';return;}const o=st.order;if(!o||!['PENDING_APPROVAL','READY'].includes(o.status))return;const pre=o.status==='PENDING_APPROVAL';if(pre)st.held-=o.cost;st.available+=o.cost;o.status=next;o.reason=reason;st.logs.push({label:`${next==='REJECTED'?'未批准':'取消'} ${o.name}`,detail:pre?'释放预留，不计作新赚取':'已批准未兑现，退回原价',delta:`+${o.cost}`,type:pre?'预留释放':'退款'});closeModal();render();toast('已处理，积分完整返还。');}
function savePlan(){const name=$('plan-name').value.trim(),points=Number($('plan-points').value);if([...name].length<2||[...name].length>40||!Number.isInteger(points)||points<1||points>1000){$('plan-error').textContent='名称需 2—40 字，积分需为 1—1,000 的整数。';return;}st.plans.push({name,points,description:$('plan-desc').value,start:$('plan-start').value});st.page='plans';render();toast('演示计划已发布，仅保存于本地预览。');}
function choosePhotos(){if(st.proofs.length>=3){toast('最多 3 张照片，请先移除一张。');return;}$('proof-files').click();}
function addDemoPhoto(){if(st.proofs.length>=3){toast('最多 3 张照片。');return;}const p={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),src:demoSvg('proof'),status:'UPLOADING',demo:true};st.proofs.push(p);render();setTimeout(()=>{if(!st.proofs.includes(p))return;p.status='PROCESSING';render();setTimeout(()=>{if(!st.proofs.includes(p))return;p.status='READY';render();},650);},550);}
function removePhoto(id){st.proofs=st.proofs.filter(p=>p.id!==id);render();}
function retryPhoto(id){removePhoto(id);choosePhotos();}
function viewPhoto(type,i){const p=(type==='draft'?st.proofs:st.submittedProofs)[i];if(!p?.src)return;modal(p.demo?'完成照片 · 本地示意':'完成照片 · 本地文件',`<p>此图片仅在当前浏览器内存中，未发送网络。正式图片仅本人及有权限的家长可读。</p><img class="preview-image" src="${p.src}" alt="完成照片大图">`,``);}
function readFile(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('文件读取失败，请重新选择。'));reader.readAsDataURL(file);});}
async function validateImage(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('仅支持 JPEG/PNG/WebP');if(file.size>10*1024*1024)throw new Error('文件超过 10 MiB');const src=await readFile(file);await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>im.width*im.height<=40000000?resolve():reject(new Error('图片超过 4,000 万像素'));im.onerror=()=>reject(new Error('无法读取此图片'));im.src=src;});return src;}
$('avatar-file').addEventListener('change',async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;try{st.avatar=await validateImage(f);render();toast('头像本地读取成功。正式产品还须服务端处理后保存资料。');}catch(e){toast(e.message+'。昵称已保留，请重新选择头像。');}});
$('proof-files').addEventListener('change',async ev=>{const files=Array.from(ev.target.files);ev.target.value='';if(!files.length)return;const remaining=3-st.proofs.length;if(files.length>remaining)toast(`最多 3 张，仅接收本次前 ${remaining} 张。`);for(const file of files.slice(0,remaining)){const p={id:String(Date.now()+Math.random()),src:'',status:'UPLOADING',demo:false};st.proofs.push(p);render();try{p.src=await validateImage(file);if(!st.proofs.includes(p))continue;p.status='PROCESSING';render();await new Promise(r=>setTimeout(r,700));if(!st.proofs.includes(p))continue;p.status='READY';render();}catch(e){if(!st.proofs.includes(p))continue;p.status='FAILED';p.error=e.message;render();}}});
function confirmReset(){modal('恢复初始演示',`<p>清除当前页的演示资料、照片、积分变化和订单，回到模拟微信登录。不会影响任何真实数据。</p>`,`<button class="primary full" onclick="closeModal();reset()">确认恢复初始演示</button>`);}
reset();
</script>
</body>
</html>
